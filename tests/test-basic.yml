name: Test basic usage - generate 3D contribution SVGs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: octocat
        continue-on-error: true
      - name: Assert SVG files were generated or action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking for SVG output files..."
            if [ ! -d "./profile-3d-contrib" ]; then
              echo "FAIL: profile-3d-contrib directory not found"
              exit 1
            fi
            if [ ! -f "./profile-3d-contrib/profile-green-animate.svg" ]; then
              echo "FAIL: profile-green-animate.svg not found"
              exit 1
            fi
            if [ ! -f "./profile-3d-contrib/profile-green.svg" ]; then
              echo "FAIL: profile-green.svg not found"
              exit 1
            fi
            if [ ! -f "./profile-3d-contrib/profile-season-animate.svg" ]; then
              echo "FAIL: profile-season-animate.svg not found"
              exit 1
            fi
            if [ ! -f "./profile-3d-contrib/profile-season.svg" ]; then
              echo "FAIL: profile-season.svg not found"
              exit 1
            fi
            # Verify SVG content
            SVG_CONTENT=$(cat ./profile-3d-contrib/profile-green.svg)
            if ! echo "$SVG_CONTENT" | grep -q "<svg"; then
              echo "FAIL: profile-green.svg does not contain SVG content"
              exit 1
            fi
            echo "PASS: All expected SVG files generated"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API rate limit or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
