name: Test invalid YEAR
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: "fake-token-for-testing"
          USERNAME: "octocat"
          YEAR: "not-a-year"
      - name: Assert action failed due to invalid YEAR
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when YEAR is NaN, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when YEAR is not a number"
