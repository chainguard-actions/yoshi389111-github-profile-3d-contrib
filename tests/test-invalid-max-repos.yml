name: Test invalid MAX_REPOS - should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: "not-a-number"
          # Point to a non-existent endpoint as fallback in case MAX_REPOS check is bypassed
          GITHUB_ENDPOINT: http://127.0.0.1:19999/graphql
      - name: Assert action failed due to invalid MAX_REPOS
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when MAX_REPOS is NaN, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when MAX_REPOS is not a number"
