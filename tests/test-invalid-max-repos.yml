name: Test invalid MAX_REPOS fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no pre-existing output directory
        run: rm -rf profile-3d-contrib

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: "testuser"
          MAX_REPOS: "not-a-number"

      - name: Assert action failed due to invalid MAX_REPOS
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (outcome=failure) when MAX_REPOS is NaN"
            exit 0
          fi
          if [ -d "profile-3d-contrib" ]; then
            echo "FAIL: expected action to fail when MAX_REPOS is NaN, but SVG files were generated (outcome=$OUTCOME)"
            exit 1
          fi
          echo "PASS: action did not generate SVG files when MAX_REPOS is NaN"
