name: Test missing USERNAME
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ""
          # Point to a non-listening port so that even if USERNAME is somehow
          # resolved from the system environment, any API call will fail.
          GITHUB_ENDPOINT: "http://127.0.0.1:19997"
      - name: Assert action failed due to missing username or connection error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when USERNAME is empty, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when USERNAME is empty"
