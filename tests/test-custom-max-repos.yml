name: Test custom MAX_REPOS - generate SVG files with limited repos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: octocat
          MAX_REPOS: "5"

      - name: Assert SVG files were generated with custom MAX_REPOS
        run: |
          echo "Checking for generated SVG files in profile-3d-contrib/"
          ls -la profile-3d-contrib/ || { echo "FAIL: profile-3d-contrib/ directory not found"; exit 1; }

          if [ ! -f "profile-3d-contrib/profile-green.svg" ]; then
            echo "FAIL: profile-green.svg not found"
            exit 1
          fi

          # Verify the SVG file is non-empty and contains SVG content
          if ! grep -q "<svg" profile-3d-contrib/profile-green.svg; then
            echo "FAIL: profile-green.svg does not contain valid SVG content"
            exit 1
          fi

          echo "PASS: SVG files generated successfully with MAX_REPOS=5"
