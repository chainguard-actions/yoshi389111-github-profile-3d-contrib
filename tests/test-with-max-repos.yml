name: Test with MAX_REPOS parameter - invalid token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with MAX_REPOS parameter and invalid token (expect failure)
        id: action
        uses: .
        env:
          GITHUB_TOKEN: fake-token-for-testing
          USERNAME: octocat
          MAX_REPOS: "50"
        continue-on-error: true
      - name: Assert action ran (outcome is failure or success, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with MAX_REPOS parameter (outcome=$OUTCOME)"
