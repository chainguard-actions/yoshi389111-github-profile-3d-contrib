name: Test missing GITHUB_TOKEN - should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clear GITHUB_TOKEN for action step
        run: |
          # Unset GITHUB_TOKEN so the action sees it as empty
          echo "GITHUB_TOKEN=" >> $GITHUB_ENV
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""
          USERNAME: testuser
          # Point to a non-existent endpoint as fallback in case token override is bypassed
          GITHUB_ENDPOINT: http://127.0.0.1:19999/graphql
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_TOKEN is empty, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_TOKEN is empty"
