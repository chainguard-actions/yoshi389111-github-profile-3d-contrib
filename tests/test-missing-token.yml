name: Test missing GITHUB_TOKEN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""
          USERNAME: "octocat"
          # Point to a non-listening port so that even if GITHUB_TOKEN is somehow
          # injected by act, any API call will fail (connection refused).
          GITHUB_ENDPOINT: "http://127.0.0.1:19998"
      - name: Assert action failed due to missing token or connection error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_TOKEN is empty, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_TOKEN is empty"
